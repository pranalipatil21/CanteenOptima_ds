apiVersion: v1
kind: ConfigMap
metadata:
  name: canteen-config
  namespace: default
data:
  RABBITMQ_URL: "amqp://rabbitmq-service:5672"
  ORDER_SERVICE_URL: "http://order-service:8001"
  MENU_SERVICE_URL: "http://menu-service:8002"
  KITCHEN_SERVICE_URL: "http://kitchen-service:8003"
  MONITORING_SERVICE_URL: "http://monitoring-service:8009"

---
# 1. RabbitMQ Broker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
        - containerPort: 5672
        - containerPort: 15672
        readinessProbe:
          tcpSocket:
            port: 5672
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672

---

# 3. Kitchen Service (3 Replicas to show Scaling / Load Balancing)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchen-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kitchen-service
  template:
    metadata:
      labels:
        app: kitchen-service
    spec:
      containers:
      - name: kitchen-service
        image: canteen-kitchen-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8003
        env:
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: canteen-config
              key: RABBITMQ_URL
        - name: ORDER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: canteen-config
              key: ORDER_SERVICE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 15
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: kitchen-service
spec:
  selector:
    app: kitchen-service
  ports:
  - port: 8003
    targetPort: 8003

---
# 4. API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: canteen-api-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: canteen-config
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - port: 8000
    targetPort: 8000

---
# 5. Frontend React App
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: canteen-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
